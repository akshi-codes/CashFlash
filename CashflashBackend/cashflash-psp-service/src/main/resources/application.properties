spring.config.import=optional:file:../.env[.properties]
spring.application.name=cashflash-psp-service
server.address=0.0.0.0
server.port=28082

spring.web.error.include-message=${SPRING_WEB_ERROR_INCLUDE_MESSAGE:always}
spring.web.error.include-binding-errors=${SPRING_WEB_ERROR_INCLUDE_BINDING_ERRORS:on_param}
spring.web.error.include-stacktrace=${SPRING_WEB_ERROR_INCLUDE_STACKTRACE:on_param}

spring.datasource.url=${SPRING_DATASOURCE_PSP_URL:jdbc:mysql://localhost:3306/cashflash_pspdb?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_PSP_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PSP_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}

jwt.secret=${JWT_SECRET:cashflash-is-superfast-and-safe-to-send-or-receive-money}

logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.springframework=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:WARN}
logging.level.org.hibernate=${LOGGING_LEVEL_ORG_HIBERNATE:WARN}
logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:WARN}

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n%wEx

spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
