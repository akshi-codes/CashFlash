spring.config.import=optional:file:../.env[.properties]
spring.application.name=cashflash-main-service
server.address=0.0.0.0

spring.web.error.include-message=${SPRING_WEB_ERROR_INCLUDE_MESSAGE:always}
spring.web.error.include-binding-errors=${SPRING_WEB_ERROR_INCLUDE_BINDING_ERRORS:on_param}
spring.web.error.include-stacktrace=${SPRING_WEB_ERROR_INCLUDE_STACKTRACE:on_param}

spring.datasource.url=${SPRING_DATASOURCE_MAIN_URL:jdbc:mysql://localhost:3306/cashflashdb?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_MAIN_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_MAIN_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}

jwt.secret=${JWT_SECRET:cashflash-is-superfast-and-safe-to-send-or-receive-money}
psp.base-url=${PSP_BASE_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}

app.upload.profile.dir=${APP_UPLOAD_PROFILE_DIR:./uploads/profile}
app.upload.kyc.dir=${APP_UPLOAD_KYC_DIR:./uploads/kyc}
app.upload.profile.public-base=${APP_UPLOAD_PROFILE_PUBLIC_BASE:/files/profile}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.springframework=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:WARN}
logging.level.org.hibernate=${LOGGING_LEVEL_ORG_HIBERNATE:WARN}
logging.level.org.springframework.web.socket.config.WebSocketMessageBrokerStats=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEBSOCKET_CONFIG_WEBSOCKETMESSAGEBROKERSTATS:WARN}

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n%wEx

spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
